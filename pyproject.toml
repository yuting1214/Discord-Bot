[project]
name = "discord-llm-bot"
version = "0.2.0"
description = "A Discord LLM chatbot with FastAPI, PostgreSQL and semantic search"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7",
    "fastapi>=0.130",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.9",
    "pydantic-settings",
    "asyncpg",
    "aiosqlite",
    "psycopg2-binary",
    "python-dotenv",
    "itsdangerous",
    "jinja2",
    "python-multipart",
    "httpx",
    "requests",
    "pytz",
    "meilisearch",
    # OpenAI and OpenRouter share a wire protocol, so one SDK serves both.
    "openai>=1.100",
    "uvloop; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio[trio]",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "llm"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
